  <div class="header-actions">

    <button [disabled]="!canDelete()" (click)="deleteAll()">
      Supprimer
    </button>

  </div>

</header>

<aside class="navigation">
  <a href="#home">Home</a>

</aside>

  <section id="about">

  <section id="tasks">
    <app-task-list />
  </section>

</main>
